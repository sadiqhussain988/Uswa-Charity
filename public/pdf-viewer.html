<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PDF Viewer</title>
    <style>
      html,body { height:100%; margin:0; background:#0b0b0b; color:#fff; font-family:Inter, system-ui, Arial; }
      .frame-wrap{ position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:24px; box-sizing:border-box }
      .viewer{ width:100%; max-width:1100px; height:calc(100% - 48px); background:#000; border-radius:8px; overflow:hidden; position:relative }
      iframe{ width:100%; height:100%; border:0 }
      .topbar{ position:absolute; right:12px; top:12px; display:flex; gap:8px; align-items:center }
      .btn{ background:#ffda6b; color:#031018; padding:8px 12px; border-radius:999px; text-decoration:none; font-weight:600 }
      .close{ background:rgba(255,255,255,0.06); color:#fff; padding:8px 10px; border-radius:8px; text-decoration:none }
      .title{ position:absolute; left:18px; top:14px; font-size:14px; opacity:0.9 }
      @media (max-width:640px){ .viewer{ height:calc(100% - 24px); } }
    </style>
  </head>
  <body>
    <div class="frame-wrap">
      <div class="viewer" id="viewer">
        <div class="title" id="title">PDF</div>
        <div class="topbar">
          <a id="downloadBtn" class="btn" href="#" download>Download</a>
          <a id="closeBtn" class="close" href="#">Close</a>
        </div>
        <iframe id="pdfFrame" src="about:blank"></iframe>
      </div>
    </div>

    <script>
      function qs(key){
        const s = new URLSearchParams(location.search);
        return s.get(key);
      }

      const src = qs('src') || '';
      const title = qs('title') || 'PDF Document';

      const pdf = document.getElementById('pdfFrame');
      const dl = document.getElementById('downloadBtn');
      const ttl = document.getElementById('title');
      const closeBtn = document.getElementById('closeBtn');

      function safeDecode(v){ try { return decodeURIComponent(v); } catch(e){ return v; } }

      if(!src){ ttl.textContent = 'No PDF specified'; pdf.src = 'about:blank'; dl.style.display='none'; }
      else{
        const decoded = safeDecode(src);
        pdf.src = decoded;
        dl.href = decoded;
        dl.setAttribute('download','');
        ttl.textContent = safeDecode(title);
      }

      closeBtn.addEventListener('click', (e)=>{ e.preventDefault(); window.close(); });
    </script>
  </body>
</html>
